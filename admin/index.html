<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Admin Login | SunShine Web Radio</title>
<link rel="icon" href="../assets/sunshine-logo.png" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=1">
</head><body>
<div class="admin-shell">
<header class="admin-topbar"><a class="admin-brand" href="../index.html"><img src="../assets/sunshine-logo.png" alt="SunShine"><div><strong>SunShine Admin</strong><span>Private control area</span></div></a></header>
<main class="auth-wrap">
<section class="auth-card">
<img class="auth-logo" src="../assets/sunshine-logo.png" alt="SunShine Web Radio">
<h1>Admin Login</h1><p class="lead">Username and password are required.</p>
<form class="form-grid" id="loginForm" autocomplete="off">
<label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="64" required autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required>
<button class="primary-btn" type="submit">Login</button>
<p id="loginStatus" class="form-status" aria-live="polite"></p>
</form>
</section></main></div>
<script src="admin.js?v=1"></script>
</body></html>
