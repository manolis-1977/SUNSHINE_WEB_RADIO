<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Admin Setup | SunShine Web Radio</title>
<link rel="icon" href="../assets/sunshine-logo-transparent.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=1">
</head><body>
<div class="admin-shell"><header class="admin-topbar"><div class="admin-brand"><img src="../assets/sunshine-logo-transparent.png" alt="SunShine"><div><strong>SunShine Admin</strong><span>One-time secure setup</span></div></div></header>
<main class="auth-wrap"><section class="auth-card">
<h1>First Admin Setup</h1><p class="lead">This page works only once. After setup, use the normal Admin Login.</p>
<form class="form-grid" id="setupForm" autocomplete="off">
<label for="setupKey">One-time Setup Key</label><input id="setupKey" type="password" autocomplete="off" required>
<label for="setupUsername">Username</label><input id="setupUsername" type="text" autocomplete="username" minlength="3" maxlength="64" required>
<label for="setupPassword">Password</label><input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required>
<label for="setupConfirm">Confirm Password</label><input id="setupConfirm" type="password" autocomplete="new-password" minlength="12" required>
<button class="primary-btn" type="submit">Create Admin</button>
<p id="setupStatus" class="form-status" aria-live="polite"></p>
</form></section></main></div>
<script src="admin.js?v=1"></script>
</body></html>
