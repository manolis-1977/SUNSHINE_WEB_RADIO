name: Convert SunShine logo to PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/convert-logo-png.yml"
      - "assets/sunshine-logo.webp"

permissions:
  contents: write

jobs:
  convert-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert WebP logo to PNG and update references
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f assets/sunshine-logo.webp ]]; then
            echo "PNG conversion already completed."
            exit 0
          fi

          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/sunshine-logo.webp")
          target = Path("assets/sunshine-logo.png")

          with Image.open(source) as image:
              image.convert("RGBA").save(target, "PNG", optimize=True)

          text_extensions = {".html", ".css", ".js", ".json", ".md", ".yml", ".yaml", ".xml", ".txt", ".py"}
          excluded = {Path(".github/workflows/convert-logo-png.yml")}

          for path in Path(".").rglob("*"):
              if not path.is_file() or path in excluded or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace("sunshine-logo.webp", "sunshine-logo.png")
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

          git rm assets/sunshine-logo.webp
          git add -A

      - name: Commit PNG logo migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No conversion changes to commit."
            exit 0
          fi
          git config user.name "SunShine Web Radio Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "assets: migrate all SunShine logos to PNG"
          git push origin HEAD:main
