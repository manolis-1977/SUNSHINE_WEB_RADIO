name: Deploy SunShine Web Radio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SunShine static site
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required files..."
          for file in \
            index.html \
            live-radio.html \
            shows.html \
            schedule.html \
            djs.html \
            chat.html \
            contact.html \
            assets/css/styles.css \
            assets/sunshine-radiance.svg \
            assets/js/app.js \
            assets/js/site.js \
            assets/sunshine-logo.webp
          do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing"
              exit 1
            fi
            echo "PASS: $file"
          done

          echo "Checking locked homepage content..."
          grep -Fq "SunShine Web Radio" index.html || {
            echo "::error file=index.html::SunShine Web Radio branding is missing"
            exit 1
          }

          grep -Fq "Today's" index.html || {
            echo "::error file=index.html::Today's Schedule section is missing"
            exit 1
          }

          grep -Fq "SunShine Chat" index.html || {
            echo "::error file=index.html::SunShine Chat section is missing"
            exit 1
          }

          if grep -Fq "Explore Our Music" index.html; then
            echo "::error file=index.html::Explore Our Music must remain excluded from the current homepage"
            exit 1
          fi

          grep -Fq "PHASE 2A: GLOBAL SUNSHINE BACKGROUND SYSTEM" assets/css/styles.css || {
            echo "::error file=assets/css/styles.css::Global SunShine background system is missing"
            exit 1
          }

          for page in live-radio.html shows.html schedule.html djs.html chat.html contact.html
          do
            grep -Fq 'class="sunshine-page' "$page" || {
              echo "::error file=$page::Shared SunShine page background class is missing"
              exit 1
            }
          done

          grep -Fq "PHASE 2B: FINAL IMAGE 1-2 VISUAL LOCK" assets/css/styles.css || {
            echo "::error file=assets/css/styles.css::Final Image 1-2 visual lock is missing"
            exit 1
          }
          echo "SUNSHINE MULTI-PAGE + FINAL IMAGE 1-2 VISUAL VALIDATION: PASS"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload SunShine site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy SunShine to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
